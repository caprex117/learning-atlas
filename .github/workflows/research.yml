name: Learning Atlas scheduled research

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-scheduled-research
  cancel-in-progress: false

jobs:
  research:
    if: vars.ATLAS_RESEARCH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Update the owner's catalog
        run: python scripts/refresh_catalog.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ATLAS_EMAIL: ${{ secrets.ATLAS_EMAIL }}
          ATLAS_PASSWORD: ${{ secrets.ATLAS_PASSWORD }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
